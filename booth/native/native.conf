# Booth settings for the native app. Read every time booth.py starts (it restarts itself in about 2 seconds:
# hold * for 3 seconds on the phone, or reboot).

LINE=1            # shown on screen and printed on the receipt (setup-native.sh sets it)
SECS=10           # clip length in seconds, 5-15
MODEL=h3          # h3 = H3 Max first, FLUX 3 Max as the backup.  flux = the other way round.
LANGUAGE=en       # what visitors speak; "auto" lets the speech model guess (a little slower)
END_PAUSE=5       # listening ends on #, or after this many seconds of quiet once they've spoken
LISTEN_MAX=30     # and never lasts longer than this (seconds)
PRINTER=/dev/usb/lp0
LOCATION=AUTO   # on the receipt: AUTO = the city this Pi is in (looked up from its internet address), or name a place
PRINT_LIGHTEN=35  # how much lighter the receipt's pictures print, 0-100 (0 = as filmed)

# Screen rotation: normal | left | right | inverted   (left/right for a portrait monitor)
ROTATE=normal

# Handset levels (percent). Raise SPEAKER if the earpiece is quiet; lower MIC if the agent hears echo.
SPEAKER_VOLUME=85
MIC_VOLUME=90

# The VOLUME and RINGER sliders on the phone's front panel (MS-303), read by the Pico.
LOW_VOLUME=40     # volume switch on LOW: handset and video sound at this percent of loud
RING_EVERY=120    # ringer switch ON: while nobody's on the phone, it rings this often (seconds, at least 20)
SHARE_BASE=https://fal-adobe-max.vercel.app/v   # the event page the QR codes open; empty = the video's own link
