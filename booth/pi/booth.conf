# Booth settings. Read by kiosk.sh on every launch.

# Page to show.  ?booth=1 lets the site hide on-screen call buttons if it wants to.
URL="https://fal-call-center.vercel.app/?booth=1"

# Screen rotation: normal | left | right | inverted   (left/right for a portrait monitor)
ROTATE="normal"

# Handset levels (percent). Raise SPEAKER if the earpiece is quiet; lower MIC if the agent hears echo.
SPEAKER_VOLUME=85
MIC_VOLUME=90
