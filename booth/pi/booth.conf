# Booth settings. Read by kiosk.sh on every launch.

# The booth page for this line (setup.sh sets the line number).
URL="https://fal-call-center.vercel.app/booth?line=1"
# To make FLUX 3 Max the main model (H3 Max as backup), add &model=flux to the URL above.

# Screen rotation: normal | left | right | inverted   (left/right for a portrait monitor)
ROTATE="normal"

# Handset levels (percent). Raise SPEAKER if the earpiece is quiet; lower MIC if the agent hears echo.
SPEAKER_VOLUME=85
MIC_VOLUME=90
